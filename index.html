<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberSecurity AR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a2a; font-family: monospace; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff88;
            background: rgba(0,0,0,0.8);
            padding: 12px 20px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            z-index: 10;
            pointer-events: none;
        }
        #info h1 { margin: 0; font-size: 18px; }
        #info p { margin: 4px 0 0 0; font-size: 11px; opacity: 0.7; }
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ff88;
            background: rgba(0,0,0,0.85);
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            z-index: 10;
            font-size: 12px;
            min-width: 180px;
        }
        #stats div { padding: 3px 0; border-bottom: 1px solid rgba(0,255,136,0.08); }
        #stats div:last-child { border-bottom: none; }
        #threat {
            margin-top: 8px;
            padding: 6px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
        }
        .low { background: #00cc44; color: #000; }
        .medium { background: #ff8800; color: #000; }
        .high { background: #ff0000; color: #fff; animation: blink 0.5s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0,0,0,0.75);
            padding: 10px 16px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0,255,136,0.2);
        }
        #controls button {
            background: rgba(0,0,0,0.8);
            color: #00ff88;
            border: 2px solid #00ff88;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        #controls button:hover { background: #00ff88; color: #000; transform: scale(1.05); }
        #controls button#arBtn {
            border-color: #8844ff;
            color: #aa88ff;
        }
        #controls button#arBtn:hover { background: #8844ff; color: #fff; }
        #alert {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 25px;
            border-radius: 10px;
            z-index: 20;
            font-weight: bold;
            font-size: 14px;
            display: none;
            background: rgba(0,0,0,0.9);
            color: #fff;
            border: 2px solid #00ff88;
            text-align: center;
            pointer-events: none;
        }
        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: #00ff88;
            font-size: 22px;
        }
        #loading span { animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        #hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.2);
            font-size: 11px;
            z-index: 5;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="loading"><span>🛡️ Завантаження CyberSecurity AR...</span></div>

<div id="info">
    <h1>🛡️ CyberSecurity AR</h1>
    <p>Симуляція кібератак та захисту</p>
</div>

<div id="stats">
    <div>📦 Всього: <span id="total">0</span></div>
    <div>🚫 Заблоковано: <span id="blocked">0</span></div>
    <div>⚠️ Підозрілих: <span id="suspicious">0</span></div>
    <div>✅ Дозволено: <span id="allowed">0</span></div>
    <div>📊 Швидкість: <span id="rate">0.0</span> пак/с</div>
    <div id="threat" class="low">🟢 LOW РІВЕНЬ</div>
</div>

<div id="alert"></div>
<div id="hint">🖱️ Крути мишею • 📱 AR на Android Chrome</div>

<div id="controls">
    <button id="btnDDoS">💣 DDoS</button>
    <button id="btnScan">🔍 Сканування</button>
    <button id="btnReset">🔄 Скинути</button>
    <button id="arBtn">📱 AR Режим</button>
</div>

<!-- ===================== БІБЛІОТЕКИ ===================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
</script>

<script>
// ============================================================
// ВЕСЬ КОД В ОДНОМУ ФАЙЛІ - AR + 3D + КРУТИЛКА
// ============================================================

// --- ЗМІННІ ---
let scene, camera, renderer, controls;
let nodes = {};
let particles = [];
let stats = { total: 0, blocked: 0, suspicious: 0, allowed: 0 };
let packetCount = 0;
let lastTime = Date.now();
let isARMode = false;
let arSession = null;

// --- ІНІЦІАЛІЗАЦІЯ ---
function init() {
    console.log('🚀 Запуск CyberSecurity AR...');
    
    // Сцена
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a2a);
    
    // Камера
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3, 2, 4);
    camera.lookAt(0, 0, 0);
    
    // Рендерер
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.xr.enabled = true; // ВКЛЮЧАЄМО AR
    document.body.prepend(renderer.domElement);
    
    // ========== КРУТИЛКА (OrbitControls) ==========
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.minDistance = 1.5;
    controls.maxDistance = 10;
    
    // Світло
    const ambient = new THREE.AmbientLight(0x334466, 0.6);
    scene.add(ambient);
    
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(5, 8, 5);
    light.castShadow = true;
    light.shadow.mapSize.width = 1024;
    light.shadow.mapSize.height = 1024;
    scene.add(light);
    
    const fill = new THREE.DirectionalLight(0x4488ff, 0.3);
    fill.position.set(-3, 1, -2);
    scene.add(fill);
    
    // Підлога
    const grid = new THREE.GridHelper(6, 20, 0x00ff88, 0x3366aa);
    grid.position.y = -0.5;
    grid.material.transparent = true;
    grid.material.opacity = 0.5;
    scene.add(grid);
    
    // Створення мережі
    createNetwork();
    
    // UI
    document.getElementById('btnDDoS').addEventListener('click', startDDoS);
    document.getElementById('btnScan').addEventListener('click', startScan);
    document.getElementById('btnReset').addEventListener('click', resetAll);
    document.getElementById('arBtn').addEventListener('click', toggleAR);
    
    document.getElementById('loading').style.display = 'none';
    
    // Авто-трафік
    setInterval(autoTraffic, 2500);
    
    animate();
    console.log('✅ Додаток готовий! Крутіть мишею для огляду.');
}

// --- СТВОРЕННЯ МЕРЕЖІ ---
function createNetwork() {
    function createBox(w, h, d, color, emissive = 0x000000) {
        const mat = new THREE.MeshStandardMaterial({ 
            color, emissive, metalness: 0.5, roughness: 0.4
        });
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
    }
    
    // Сервер
    const server = createBox(0.5, 0.35, 0.5, 0x00ff88, 0x004433);
    server.position.set(-1.2, 0, -0.6);
    scene.add(server);
    nodes.server = server;
    
    // Комп'ютери
    const pcPositions = [
        [-0.5, -0.1, 0.3],
        [0.3, -0.1, 0.5],
        [-0.7, -0.1, -0.1],
        [0.5, -0.1, -0.3]
    ];
    pcPositions.forEach((pos, i) => {
        const pc = createBox(0.3, 0.3, 0.2, 0x4488ff);
        pc.position.set(pos[0], pos[1], pos[2]);
        scene.add(pc);
        nodes[`pc${i}`] = pc;
    });
    
    // Роутер
    const routerMat = new THREE.MeshStandardMaterial({ 
        color: 0xff8844, emissive: 0x442200, metalness: 0.7, roughness: 0.3
    });
    const router = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32), routerMat);
    router.position.set(0.7, 0.1, -0.8);
    router.castShadow = true;
    scene.add(router);
    nodes.router = router;
    
    // Firewall
    const firewall = createBox(0.35, 0.35, 0.35, 0xff4444, 0x441111);
    firewall.position.set(0.2, -0.1, 0.6);
    scene.add(firewall);
    nodes.firewall = firewall;
    
    // З'єднання
    const connections = [
        ['server', 'router'], ['router', 'firewall'],
        ['pc0', 'router'], ['pc1', 'router'],
        ['pc2', 'router'], ['pc3', 'router']
    ];
    connections.forEach(([a, b]) => {
        if (!nodes[a] || !nodes[b]) return;
        const p1 = nodes[a].position;
        const p2 = nodes[b].position;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z]);
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ 
            color: 0x44ff88, transparent: true, opacity: 0.25 
        }));
        scene.add(line);
    });
}

// --- ПАКЕТ ---
function createPacket(from, to, color, emissive, size = 0.05) {
    if (!nodes[from] || !nodes[to]) return null;
    const mat = new THREE.MeshStandardMaterial({
        color, emissive, emissiveIntensity: 0.5
    });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 12, 12), mat);
    mesh.position.copy(nodes[from].position);
    mesh.userData = {
        start: nodes[from].position.clone(),
        end: nodes[to].position.clone(),
        progress: 0,
        speed: 0.02 + Math.random() * 0.025
    };
    scene.add(mesh);
    particles.push(mesh);
    setTimeout(() => {
        if (mesh.parent) scene.remove(mesh);
        particles = particles.filter(p => p !== mesh);
    }, 3500);
    return mesh;
}

// --- АВТО-ТРАФІК ---
function autoTraffic() {
    if (stats.total > 300) return;
    const targets = ['pc0', 'pc1', 'pc2', 'pc3'];
    const target = targets[Math.floor(Math.random() * targets.length)];
    const p = createPacket('router', target, 0x44ff88, 0x226644, 0.035);
    if (p) { stats.total++; stats.allowed++; packetCount++; updateStats(); }
}

// --- DDoS ---
function startDDoS() {
    showAlert('⚠️ DDoS АТАКА!', '#ff0000');
    highlightAll(0xff0000);
    const count = 80;
    let blocked = 0;
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const p = createPacket('router', 'server', 0xff0000, 0x660000);
            if (p) { stats.total++; stats.blocked++; blocked++; packetCount++; updateStats(); }
        }, i * 45);
    }
    setTimeout(() => {
        showAlert(`✅ DDoS відбито! Заблоковано ${blocked}/${count}.`, '#00ff88');
        setTimeout(() => document.getElementById('alert').style.display = 'none', 2500);
        updateThreat('high');
    }, count * 45 + 1500);
}

// --- СКАНУВАННЯ ---
function startScan() {
    showAlert('🔍 Сканування портів!', '#ff8800');
    highlightNode('firewall', 0xff8800);
    const count = 40;
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const targets = ['pc0', 'pc1', 'pc2', 'pc3'];
            const target = targets[Math.floor(Math.random() * targets.length)];
            const p = createPacket('router', target, 0xff8800, 0x442200, 0.035);
            if (p) { stats.total++; stats.suspicious++; packetCount++; updateStats(); }
        }, i * 35);
    }
    setTimeout(() => {
        showAlert('✅ Сканування завершено', '#00ff88');
        setTimeout(() => document.getElementById('alert').style.display = 'none', 2000);
        updateThreat('medium');
    }, count * 35 + 1500);
}

// --- СКИДАННЯ ---
function resetAll() {
    particles.forEach(p => { if (p.parent) scene.remove(p); });
    particles = [];
    stats = { total: 0, blocked: 0, suspicious: 0, allowed: 0 };
    packetCount = 0;
    updateStats();
    updateThreat('low');
    Object.values(nodes).forEach(node => {
        if (node.material && node.material.color) {
            if (node === nodes.server) node.material.color.setHex(0x00ff88);
            else if (node === nodes.firewall) node.material.color.setHex(0xff4444);
            else if (node === nodes.router) node.material.color.setHex(0xff8844);
            else node.material.color.setHex(0x4488ff);
        }
    });
    showAlert('🔄 Система скинута', '#00ff88');
    setTimeout(() => document.getElementById('alert').style.display = 'none', 2000);
}

// --- ПІДСВІЧУВАННЯ ---
function highlightAll(color) {
    Object.values(nodes).forEach(node => {
        if (node.material && node.material.color) {
            const orig = node.material.color.getHex();
            node.material.color.setHex(color);
            setTimeout(() => { if (node.material) node.material.color.setHex(orig); }, 2000);
        }
    });
}
function highlightNode(name, color) {
    const node = nodes[name];
    if (node && node.material && node.material.color) {
        const orig = node.material.color.getHex();
        node.material.color.setHex(color);
        setTimeout(() => { if (node.material) node.material.color.setHex(orig); }, 1500);
    }
}

// --- СТАТИСТИКА ---
function updateStats() {
    document.getElementById('total').textContent = stats.total;
    document.getElementById('blocked').textContent = stats.blocked;
    document.getElementById('suspicious').textContent = stats.suspicious;
    document.getElementById('allowed').textContent = stats.allowed;
    const now = Date.now();
    const diff = (now - lastTime) / 1000;
    if (diff >= 1) {
        document.getElementById('rate').textContent = (packetCount / diff).toFixed(1);
        packetCount = 0;
        lastTime = now;
    }
}
function updateThreat(level) {
    const el = document.getElementById('threat');
    el.className = level;
    el.textContent = level === 'low' ? '🟢 LOW РІВЕНЬ' : 
                     level === 'medium' ? '🟡 MEDIUM РІВЕНЬ' : '🔴 HIGH РІВЕНЬ';
}
function showAlert(msg, color) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.style.background = color;
    el.style.display = 'block';
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => el.style.display = 'none', 3000);
}

// ============================================================
// ===================== AR РЕЖИМ =============================
// ============================================================
async function toggleAR() {
    if (isARMode) {
        await exitAR();
        return;
    }
    
    if (!navigator.xr) {
        showAlert('❌ WebXR не підтримується', '#ff0000');
        return;
    }
    
    try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
            showAlert('❌ AR не підтримується на цьому пристрої', '#ff0000');
            return;
        }
        
        showAlert('📸 Запит на камеру...', '#ff8800');
        
        // Запит камери
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            stream.getTracks().forEach(t => t.stop());
        } catch (e) {
            showAlert('❌ Немає доступу до камери', '#ff0000');
            return;
        }
        
        const session = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['hit-test'],
            optionalFeatures: ['dom-overlay'],
            domOverlay: { root: document.body }
        });
        
        arSession = session;
        isARMode = true;
        controls.enabled = false;
        
        renderer.xr.setSession(session);
        await session.requestReferenceSpace('local');
        
        document.getElementById('arBtn').textContent = '📱 Вийти з AR';
        document.getElementById('arBtn').style.borderColor = '#ff4444';
        document.getElementById('arBtn').style.color = '#ff4444';
        
        showAlert('✅ AR активовано! Наведіть камеру на підлогу.', '#00ff88');
        
        session.addEventListener('end', () => {
            exitAR();
        });
        
    } catch (error) {
        console.error('AR помилка:', error);
        showAlert('❌ Помилка AR: ' + error.message, '#ff0000');
        isARMode = false;
        controls.enabled = true;
    }
}

async function exitAR() {
    if (arSession) {
        try { await arSession.end(); } catch(e) {}
        arSession = null;
    }
    isARMode = false;
    controls.enabled = true;
    renderer.xr.setSession(null);
    
    document.getElementById('arBtn').textContent = '📱 AR Режим';
    document.getElementById('arBtn').style.borderColor = '#8844ff';
    document.getElementById('arBtn').style.color = '#aa88ff';
    
    showAlert('🔄 Вихід з AR. 3D-режим.', '#ff8800');
}

// --- АНІМАЦІЯ ---
function animate() {
    if (!renderer) return;
    requestAnimationFrame(animate);
    
    // КРУТИЛКА працює тільки в 3D-режимі
    if (!isARMode && controls) {
        controls.update();
    }
    
    // Рух пакетів
    particles.forEach(p => {
        if (p.userData.progress < 1) {
            p.userData.progress += p.userData.speed;
            const t = p.userData.progress;
            p.position.lerpVectors(p.userData.start, p.userData.end, t);
            const s = 1 + Math.sin(t * 25) * 0.2;
            p.scale.set(s, s, s);
        }
    });
    
    if (Math.random() < 0.02) updateStats();
    
    renderer.render(scene, camera);
}

// --- ЗАПУСК ---
init();

// --- АДАПТАЦІЯ РОЗМІРУ ---
window.addEventListener('resize', () => {
    if (!renderer) return;
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

console.log('💡 Крутіть мишею для 3D-огляду');
console.log('📱 Натисніть "AR Режим" на телефоні з Chrome');
</script>
</body>
</html>
