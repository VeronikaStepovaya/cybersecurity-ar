<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CyberSecurity AR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a2a; font-family: monospace; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff88;
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            z-index: 10;
            pointer-events: none;
        }
        #info h1 { margin: 0; font-size: 22px; }
        #info p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.7; }
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ff88;
            background: rgba(0,0,0,0.85);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #00ff88;
            z-index: 10;
            font-size: 13px;
            min-width: 200px;
            pointer-events: none;
        }
        #stats div { padding: 4px 0; border-bottom: 1px solid rgba(0,255,136,0.1); }
        #stats div:last-child { border-bottom: none; }
        #threat {
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .low { background: #00cc44; color: #000; }
        .medium { background: #ff8800; color: #000; }
        .high { background: #ff0000; color: #fff; animation: blink 0.6s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            padding: 12px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0,255,136,0.3);
        }
        #controls button {
            background: rgba(0,0,0,0.8);
            color: #00ff88;
            border: 2px solid #00ff88;
            padding: 10px 22px;
            border-radius: 8px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #controls button:hover {
            background: #00ff88;
            color: #000;
            transform: scale(1.05);
        }
        #alert {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            border-radius: 10px;
            z-index: 20;
            font-weight: bold;
            font-size: 16px;
            display: none;
            background: rgba(0,0,0,0.9);
            color: #fff;
            border: 2px solid #00ff88;
            text-align: center;
            pointer-events: none;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: #00ff88;
            font-size: 24px;
            font-family: monospace;
        }
        #loading span { animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    </style>
</head>
<body>

<div id="loading"><span>🛡️ Завантаження CyberSecurity AR...</span></div>

<div id="info">
    <h1>🛡️ CyberSecurity AR</h1>
    <p>Симуляція кібератак та захисту</p>
</div>

<div id="stats">
    <div>📦 Всього: <span id="total">0</span></div>
    <div>🚫 Заблоковано: <span id="blocked">0</span></div>
    <div>⚠️ Підозрілих: <span id="suspicious">0</span></div>
    <div>✅ Дозволено: <span id="allowed">0</span></div>
    <div>📊 Швидкість: <span id="rate">0.0</span> пак/с</div>
    <div id="threat" class="low">🟢 LOW РІВЕНЬ ЗАГРОЗИ</div>
</div>

<div id="alert"></div>

<div id="controls">
    <button id="btnDDoS">💣 DDoS Атака</button>
    <button id="btnScan">🔍 Сканування</button>
    <button id="btnReset">🔄 Скинути</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
</script>

<script>
// ============================================
// ВЕСЬ КОД В ОДНОМУ ФАЙЛІ - ПРОСТО І РОБОЧО
// ============================================

// --- ЗМІННІ ---
let scene, camera, renderer;
let nodes = {};
let particles = [];
let stats = { total: 0, blocked: 0, suspicious: 0, allowed: 0 };
let packetCount = 0;
let lastTime = Date.now();
let isRunning = true;

// --- ІНІЦІАЛІЗАЦІЯ ---
function init() {
    console.log('🚀 Запуск CyberSecurity AR...');
    
    // Сцена
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a2a);
    
    // Камера
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3, 2, 4);
    camera.lookAt(0, 0, 0);
    
    // Рендерер
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.prepend(renderer.domElement);
    
    // Світло
    const ambient = new THREE.AmbientLight(0x334466, 0.6);
    scene.add(ambient);
    
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(5, 8, 5);
    light.castShadow = true;
    light.shadow.mapSize.width = 1024;
    light.shadow.mapSize.height = 1024;
    scene.add(light);
    
    const fill = new THREE.DirectionalLight(0x4488ff, 0.3);
    fill.position.set(-3, 1, -2);
    scene.add(fill);
    
    // Підлога
    const grid = new THREE.GridHelper(6, 20, 0x00ff88, 0x3366aa);
    grid.position.y = -0.5;
    grid.material.transparent = true;
    grid.material.opacity = 0.5;
    scene.add(grid);
    
    // Створення мережі
    createNetwork();
    
    // Налаштування UI
    setupUI();
    
    // Приховати завантаження
    document.getElementById('loading').style.display = 'none';
    
    // Запуск анімації
    animate();
    
    // Авто-трафік
    setInterval(autoTraffic, 2500);
    
    console.log('✅ Додаток готовий!');
}

// --- СТВОРЕННЯ МЕРЕЖІ ---
function createNetwork() {
    // Функція створення куба
    function createBox(w, h, d, color, emissive = 0x000000) {
        const mat = new THREE.MeshStandardMaterial({ 
            color: color, 
            emissive: emissive,
            metalness: 0.5,
            roughness: 0.4
        });
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
    }
    
    // Сервер
    const server = createBox(0.5, 0.35, 0.5, 0x00ff88, 0x004433);
    server.position.set(-1.2, 0, -0.6);
    scene.add(server);
    nodes.server = server;
    
    // Комп'ютери
    const pcPositions = [
        [-0.5, -0.1, 0.3],
        [0.3, -0.1, 0.5],
        [-0.7, -0.1, -0.1],
        [0.5, -0.1, -0.3]
    ];
    pcPositions.forEach((pos, i) => {
        const pc = createBox(0.3, 0.3, 0.2, 0x4488ff);
        pc.position.set(pos[0], pos[1], pos[2]);
        scene.add(pc);
        nodes[`pc${i}`] = pc;
    });
    
    // Роутер (сфера)
    const routerMat = new THREE.MeshStandardMaterial({ 
        color: 0xff8844, 
        emissive: 0x442200,
        metalness: 0.7,
        roughness: 0.3
    });
    const router = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32), routerMat);
    router.position.set(0.7, 0.1, -0.8);
    router.castShadow = true;
    scene.add(router);
    nodes.router = router;
    
    // Firewall
    const firewall = createBox(0.35, 0.35, 0.35, 0xff4444, 0x441111);
    firewall.position.set(0.2, -0.1, 0.6);
    scene.add(firewall);
    nodes.firewall = firewall;
    
    // З'єднання (лінії)
    const connections = [
        ['server', 'router'],
        ['router', 'firewall'],
        ['pc0', 'router'],
        ['pc1', 'router'],
        ['pc2', 'router'],
        ['pc3', 'router']
    ];
    connections.forEach(([a, b]) => {
        if (!nodes[a] || !nodes[b]) return;
        const p1 = nodes[a].position;
        const p2 = nodes[b].position;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array([
            p1.x, p1.y, p1.z,
            p2.x, p2.y, p2.z
        ]);
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ 
            color: 0x44ff88, 
            transparent: true, 
            opacity: 0.25 
        }));
        scene.add(line);
    });
}

// --- СТВОРЕННЯ ПАКЕТА ---
function createPacket(from, to, color, emissive, size = 0.05) {
    if (!nodes[from] || !nodes[to]) return null;
    
    const mat = new THREE.MeshStandardMaterial({
        color: color,
        emissive: emissive,
        emissiveIntensity: 0.5
    });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 12, 12), mat);
    mesh.position.copy(nodes[from].position);
    mesh.userData = {
        start: nodes[from].position.clone(),
        end: nodes[to].position.clone(),
        progress: 0,
        speed: 0.02 + Math.random() * 0.025
    };
    scene.add(mesh);
    particles.push(mesh);
    
    setTimeout(() => {
        if (mesh.parent) scene.remove(mesh);
        particles = particles.filter(p => p !== mesh);
    }, 3500);
    
    return mesh;
}

// --- АВТОМАТИЧНИЙ ТРАФІК ---
function autoTraffic() {
    if (stats.total > 300) return;
    const targets = ['pc0', 'pc1', 'pc2', 'pc3'];
    const target = targets[Math.floor(Math.random() * targets.length)];
    const p = createPacket('router', target, 0x44ff88, 0x226644, 0.035);
    if (p) {
        stats.total++;
        stats.allowed++;
        packetCount++;
        updateStats();
    }
}

// --- DDoS АТАКА ---
function startDDoS() {
    if (!isRunning) return;
    showAlert('⚠️ DDoS АТАКА ВИЯВЛЕНА!', '#ff0000');
    highlightAll(0xff0000);
    
    const count = 80;
    let blocked = 0;
    
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const p = createPacket('router', 'server', 0xff0000, 0x660000);
            if (p) {
                stats.total++;
                stats.blocked++;
                blocked++;
                packetCount++;
                updateStats();
            }
        }, i * 45);
    }
    
    setTimeout(() => {
        showAlert(`✅ DDoS відбито! Заблоковано ${blocked}/${count} пакетів.`, '#00ff88');
        setTimeout(() => document.getElementById('alert').style.display = 'none', 2500);
        updateThreat('high');
    }, count * 45 + 1500);
}

// --- СКАНУВАННЯ ПОРТІВ ---
function startScan() {
    if (!isRunning) return;
    showAlert('🔍 ВИЯВЛЕНО СКАНУВАННЯ ПОРТІВ!', '#ff8800');
    highlightNode('firewall', 0xff8800);
    
    const count = 40;
    
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const targets = ['pc0', 'pc1', 'pc2', 'pc3'];
            const target = targets[Math.floor(Math.random() * targets.length)];
            const p = createPacket('router', target, 0xff8800, 0x442200, 0.035);
            if (p) {
                stats.total++;
                stats.suspicious++;
                packetCount++;
                updateStats();
                if (i % 5 === 0) highlightNode('firewall', 0xff8800);
            }
        }, i * 35);
    }
    
    setTimeout(() => {
        showAlert('✅ Сканування завершено', '#00ff88');
        setTimeout(() => document.getElementById('alert').style.display = 'none', 2000);
        updateThreat('medium');
    }, count * 35 + 1500);
}

// --- СКИДАННЯ ---
function resetAll() {
    particles.forEach(p => { if (p.parent) scene.remove(p); });
    particles = [];
    stats = { total: 0, blocked: 0, suspicious: 0, allowed: 0 };
    packetCount = 0;
    updateStats();
    updateThreat('low');
    
    // Відновлення кольорів
    Object.values(nodes).forEach(node => {
        if (node.material && node.material.color) {
            if (node === nodes.server) node.material.color.setHex(0x00ff88);
            else if (node === nodes.firewall) node.material.color.setHex(0xff4444);
            else if (node === nodes.router) node.material.color.setHex(0xff8844);
            else node.material.color.setHex(0x4488ff);
        }
    });
    
    showAlert('🔄 Мережа та Firewall скинуті', '#00ff88');
    setTimeout(() => document.getElementById('alert').style.display = 'none', 2000);
}

// --- ПІДСВІЧУВАННЯ ---
function highlightAll(color) {
    Object.values(nodes).forEach(node => {
        if (node.material && node.material.color) {
            const orig = node.material.color.getHex();
            node.material.color.setHex(color);
            setTimeout(() => {
                if (node.material) node.material.color.setHex(orig);
            }, 2000);
        }
    });
}

function highlightNode(name, color) {
    const node = nodes[name];
    if (node && node.material && node.material.color) {
        const orig = node.material.color.getHex();
        node.material.color.setHex(color);
        setTimeout(() => {
            if (node.material) node.material.color.setHex(orig);
        }, 1500);
    }
}

// --- UI ---
function setupUI() {
    document.getElementById('btnDDoS').addEventListener('click', startDDoS);
    document.getElementById('btnScan').addEventListener('click', startScan);
    document.getElementById('btnReset').addEventListener('click', resetAll);
}

function updateStats() {
    document.getElementById('total').textContent = stats.total;
    document.getElementById('blocked').textContent = stats.blocked;
    document.getElementById('suspicious').textContent = stats.suspicious;
    document.getElementById('allowed').textContent = stats.allowed;
    
    const now = Date.now();
    const diff = (now - lastTime) / 1000;
    if (diff >= 1) {
        const rate = packetCount / diff;
        document.getElementById('rate').textContent = rate.toFixed(1);
        packetCount = 0;
        lastTime = now;
    }
}

function updateThreat(level) {
    const el = document.getElementById('threat');
    el.className = level;
    if (level === 'low') el.textContent = '🟢 LOW РІВЕНЬ ЗАГРОЗИ';
    else if (level === 'medium') el.textContent = '🟡 MEDIUM РІВЕНЬ ЗАГРОЗИ';
    else el.textContent = '🔴 HIGH РІВЕНЬ ЗАГРОЗИ';
}

function showAlert(msg, color) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.style.background = color;
    el.style.borderColor = color;
    el.style.display = 'block';
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => {
        el.style.display = 'none';
    }, 3000);
}

// --- АНІМАЦІЯ ---
function animate() {
    if (!renderer) return;
    requestAnimationFrame(animate);
    
    // Оновлення позицій пакетів
    particles.forEach(p => {
        if (p.userData.progress < 1) {
            p.userData.progress += p.userData.speed;
            const t = p.userData.progress;
            p.position.lerpVectors(p.userData.start, p.userData.end, t);
            const s = 1 + Math.sin(t * 25) * 0.2;
            p.scale.set(s, s, s);
        }
    });
    
    // Оновлення статистики
    if (Math.random() < 0.03) updateStats();
    
    renderer.render(scene, camera);
}

// --- ЗАПУСК ---
init();

// --- АДАПТАЦІЯ РОЗМІРУ ---
window.addEventListener('resize', () => {
    if (!renderer) return;
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

console.log('💡 Натисніть кнопки для симуляції атак!');
</script>
</body>
</html>
