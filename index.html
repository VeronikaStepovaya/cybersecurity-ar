<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>CyberSecurity AR - Кібербезпека в доповненій реальності</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Заголовок -->
    <div id="info">
        <h1>🛡️ CyberSecurity AR</h1>
        <p>Симуляція кібератак та захисту в AR</p>
    </div>

    <!-- Статистика -->
    <div id="stats-panel" class="hidden">
        <h3>📊 Аналіз трафіку</h3>
        <div id="traffic-stats"></div>
        <div id="threat-level"></div>
    </div>

    <!-- Сповіщення -->
    <div id="alert" class="hidden"></div>

    <!-- Кнопки управління -->
    <div id="controls" class="hidden">
        <button id="simulate-ddos">💣 DDoS Атака</button>
        <button id="simulate-scan">🔍 Сканування портів</button>
        <button id="reset-attacks">🔄 Скинути стан</button>
        <button id="ar-toggle">📱 AR Режим</button>
    </div>

    <!-- Підключення бібліотек -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@tensorflow/tfjs": "https://unpkg.com/@tensorflow/tfjs@4.15.0/dist/tf.min.js"
            }
        }
    </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
