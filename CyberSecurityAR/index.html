<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberSecurity AR - Кібербезпека в доповненій реальності</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; }
        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ff88;
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 15px;
            z-index: 10;
            font-size: 12px;
            backdrop-filter: blur(5px);
            font-family: monospace;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        #controls button {
            background: rgba(0, 0, 0, 0.85);
            color: #00ff88;
            border: 2px solid #00ff88;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-family: monospace;
            transition: all 0.2s;
        }
        #controls button:hover {
            background: #00ff88;
            color: black;
            transform: scale(1.05);
        }
        #alert {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 10;
            text-align: center;
            font-family: monospace;
            white-space: nowrap;
            pointer-events: none;
        }
        .hidden { display: none; }
        .threat-high { background: #ff0000; color: white; animation: pulse 0.5s infinite; }
        .threat-medium { background: #ffaa00; color: black; }
        .threat-low { background: #00ff00; color: black; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="info" style="position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); color:#00ff88; padding:15px; border-radius:10px; border:2px solid #00ff88; z-index:20;">
        <h1>🛡️ CyberSecurity AR</h1>
        <p>Симуляція кібератак та захисту</p>
    </div>

    <div id="stats-panel" class="hidden">
        <h3>📊 Аналіз трафіку</h3>
        <div id="traffic-stats"></div>
        <div id="threat-level"></div>
    </div>

    <div id="alert" class="hidden"></div>

    <div id="controls" class="hidden">
        <button id="simulate-ddos">💣 DDoS Атака</button>
        <button id="simulate-scan">🔍 Сканування портів</button>
        <button id="reset-attacks">🔄 Скинути стан</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/",
                "@tensorflow/tfjs": "https://unpkg.com/@tensorflow/tfjs@4.15.0/dist/tf.min.js"
            }
        }
    </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
